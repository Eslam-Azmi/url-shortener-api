<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>URL Shortener</h1>
        <p>Paste your long link below to get a fast, cached short link.</p>
        
        <form id="shorten-form">
            <input type="url" id="long-url" placeholder="https://example.com" required>
            <button type="submit">Shorten</button>
        </form>

        <div id="result-card" class="hidden">
            <p id="error-message" class="error"></p>
            <div id="success-data" class="hidden">
                <p>Your short link:</p>
                <a id="short-url" href="#" target="_blank"></a>
            </div>
        </div>

        <hr style="border: 1px solid #333; margin: 30px 0;">

        <h2>Check Link Analytics</h2>
        <br>
        <form id="status-form">
            <input type="text" id="short-code-input" placeholder="Enter short code (e.g. aB3x9Y)" required>
            <button type="submit">View Stats</button>
        </form>
    
        <div id="status-result" class="hidden" style="margin-top: 20px; text-align: left; background: #2a2a2a; padding: 15px; border-radius: 6px;">
            <p id="status-error" class="error"></p>
            <div id="status-data" class="hidden">
                <p><strong>Original URL:</strong> <span id="stat-original"></span></p>
                <p><strong>Total Clicks:</strong> <span id="stat-clicks"></span></p>
                <h3 style="margin-top: 15px; font-size: 1rem;">Recent Activity:</h3>
                <ul id="activity-list" style="list-style-type: none; padding: 0; margin-top: 10px; font-size: 0.85rem; color: #ccc;"></ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
